stanford_decoupled.settings:
  type: config_object
  mapping:
    referenced_invalidated_types:
      type: sequence
      label: Entity Types to track for decoupled invalidations
      sequence:
        type: string
        label: Entity Type ID

next.preview_url_generator.configuration.simple_preview:
  type: mapping
  mapping:
    vercel_bypass:
      type: string
      label: 'Vercel Deployment Protection bypass'

next.revalidator.configuration.redirect_path:
  type: mapping
  mapping:
    revalidate_page:
      type: boolean
      label: 'Revalidate page'
    additional_paths:
      type: string
      label: 'Additional paths'
    method:
      type: string
      label: 'Revalidation method'
    aggregate:
      type: boolean
      label: Aggregate revalidations for next execution
