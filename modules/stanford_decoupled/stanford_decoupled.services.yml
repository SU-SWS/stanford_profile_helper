services:
  stanford_decoupled.event_subscriber:
    class: Drupal\stanford_decoupled\EventSubscriber\DecoupledEventSubscriber
    arguments:
     - '@entity_type.manager'
     - '@next.settings.manager'
     - '@state'
     - '@http_client'
     - '@database'
     - '@module_handler'
     - '@logger.factory'
    tags:
      - { name: event_subscriber }
  stanford_decoupled.config_overrider:
    class: Drupal\stanford_decoupled\Config\DecoupledConfigOverrides
    arguments: []
    tags:
      - {name: config.factory.override, priority: 5}

  stanford_decoupled.route_subscriber:
    class: Drupal\stanford_decoupled\EventSubscriber\StanfordDecoupledRouteSubscriber
    arguments: [ '%authentication_providers%' ]
    tags:
      - { name: event_subscriber }
