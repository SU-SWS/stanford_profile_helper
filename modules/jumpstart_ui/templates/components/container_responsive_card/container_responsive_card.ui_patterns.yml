container_responsive_card:
  label: Container Responsive Card
  description: "This card component comes with several fields to ensure flexibility."
  fields:
    image:
      type: text
      label: "Image"
      description: "The cards image."
      preview: "<img src='https://picsum.photos/900/900/' alt='Example Image' />"
    eyebrow:
      type: text
      label: "Eyebrow"
      description: "Text eyebrow. Second in the reading order."
      preview: "This is a super headline"
    heading:
      type: text
      label: "Heading"
      description: "Text heading. First in the reading order."
      preview: "This is the headline"
    body:
      type: text
      label: "Body"
      description: "An open variable for anything. Generally this would be for WYSIWYG editor contents"
      preview: "<p>Sample text goes here and this card should be able to handle a few lines.</p>"
  use: "stanford_profile_styles:simple_container_responsive_card"

