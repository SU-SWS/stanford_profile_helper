'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Lockup
description: 'A lockup with the Stanford wordmark logo and department/unit name. It is used in the header of a website and links to the homepage of the department/unit. When building a department lockup, besides the Stanford wordmark, the most obvious element should be the most granular relevant department.'
props:
  type: object
  properties:
    lockup_style:
      title: Lockup Style
      type: string
      examples:
        - a
        - b
        - c
slots:
  cell1:
    title: Cell 1
    description: Block for cell 1
  cell2:
    title: Cell 1
    description: Block for cell 1
  cell3:
    title: Cell 1
    description: Block for cell 1
  link:
    title: 'Lockup Link'
    description: 'The URL that the lockup links to.'
  line1:
    title: 'Line 1'
    description: 'Line 1 of the unit/site name text (to the right of the wordmark).'
  line2:
    title: 'Line 2'
    description: 'Line 2 of the unit/site name text (to the right of the wordmark).'
  line3:
    title: 'Line 3'
    description: 'Line 3 of the unit/site name text (to the right of the wordmark).'
  line4:
    title: 'Line 4'
    description: 'Line 4 of the unit/site name text (underneath the wordmark).'
  line5:
    title: 'Line 5'
    description: 'Line 5 of the unit/site name text (at the bottom part of the lockup).'
