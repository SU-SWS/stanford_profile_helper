'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Stat Card'
description: 'One of the primary building block components. This card component comes with several fields to ensure flexibility.'
props:
  type: object
  properties:
    bg_color:
      title: Background Color
      type: string
    icon_color:
      title: Icon Color
      type: string
    stat_color:
      title: Stat Color
      type: string
    centered_text:
      title: Centered Text
      type: boolean
slots:
  image:
    title: Image
    description: 'The cards image.'
  icon:
    title: Icon
  super_headline:
    title: 'Super Headline'
    description: 'Text heading'
  stat:
    title: 'Stat Text'
  headline:
    title: Headline
    description: 'Text heading'
  body:
    title: Body
    description: 'An open variable for anything. Generally this would be for WYSIWYG editor contents'
  link:
    title: Link
    description: 'A plain text string of just the URL'
libraryOverrides:
  dependencies:
    - jumpstart_ui/countup
    - core/jquery
    - core/once
