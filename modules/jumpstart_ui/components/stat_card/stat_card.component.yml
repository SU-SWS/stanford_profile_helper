'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Stat Card'
description: 'One of the primary building block components. This card component comes with several fields to ensure flexibility.'
props:
  type: object
  properties:
    header_tag:
      title: Header Tag Element
      type: string
      enum:
        - h2
        - h3
        - h4
        - div
    header_classes:
      title: Header Tag Classes
      type: string
      examples:
        - splash
    visually_hide_header:
      title: Visually hide header
      type: boolean
    bg_color:
      title: Background Color
      type: string
    icon_color:
      title: Icon Color
      type: string
    stat_color:
      title: Stat Color
      type: string
    centered_text:
      title: Centered Text
      type: boolean
    super_headline:
      title: 'Super Headline'
      type: string
    stat:
      title: 'Stat Text'
      type: string
    headline:
      title: Headline
      description: 'Text heading'
      type: string
slots:
  image:
    title: Image
    description: 'The cards image.'
  icon:
    title: Icon
  body:
    title: Body
    description: 'An open variable for anything. Generally this would be for WYSIWYG editor contents'
  link:
    title: Link
    description: 'A plain text string of just the URL'
libraryOverrides:
  dependencies:
    - jumpstart_ui/countup
    - core/jquery
    - core/once
