'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Card
description: 'One of the primary building block compontents. This card component comes with several fields to ensure flexibility.'
props:
  type: object
  properties:
    header_tag:
      title: Header Tag Element
      type: string
      examples:
        - h2
        - h3
        - h4
        - div
    header_classes:
      title: Header Tag Classes
      type: string
      examples:
        - splash
    visually_hide_header:
      title: Visually hide header
      type: boolean
      examples:
        - true
        - false
    modifier_class:
      title: Classes to modify card
      type: string
slots:
  image:
    title: Image
    description: 'The cards image.'
  super_headline:
    title: 'Super Headline'
    description: 'Text heading'
  headline:
    title: Headline
    description: 'Text heading'
  body:
    title: Body
    description: 'An open variable for anything. Generally this would be for WYSIWYG editor contents'
  link:
    title: 'Link URL'
    description: 'A plain text string of just the URL'
  cta_label:
    title: 'Link Label'
    description: 'The clickable text for the CTA link'
  button_label:
    title: 'Button Label'
    description: 'The text label of the button component'

