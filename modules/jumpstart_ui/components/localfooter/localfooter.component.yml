'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Local Footer'
description: 'Local footer element as specified by the Identity Guidelines.'
props:
  type: object
  properties:
    custom_lockup:
      title: Use a custom lockup
      type: boolean
    lockup_option:
      title: Lockup Choice
      type: string
    use_default_logo:
      title: Use default logo for lockup
      type: boolean
    primary_links_header:
      title: primary_links_header
      type: string
    secondary_links_header:
      title: secondary_links_header
      type: string
    signup_form_action:
      title: signup_form_action
      type: string
    signup_form_method:
      title: signup_form_method
      type: string
      enum: ["POST", "GET"]
    signup_form_field_submit_value:
      title: signup_form_field_submit_value
      type: string
    weblogin_url:
      title: weblogin_url
      type: string
    weblogin_text:
      title: weblogin_text
      type: string
    site_logo:
      title: Site Logo
      type: string
    site_logo_alt:
      title: Site Logo Alt
      type: string
    hide_lockup_wordmark:
      title: Hide Lockup Wordmark
      type: boolean
    lockup_title:
      title: Lockup Title
      type: string
    line1:
      title: line 1
      type: string
    line2:
      title: line 2
      type: string
    line3:
      title: line 3
      type: string
    line4:
      title: line 4
      type: string
    line5:
      title: line 5
      type: string
    lockup_link:
      title: Lockup Link
      type: string
    action_links:
      title: Action Links
      type: array
      items:
        type: object
        properties:
          url:
            type: string
          title:
            type: string
    social_links:
      title: Social Links
      type: array
      items:
        type: object
        properties:
          url:
            type: string
          title:
            type: string
    primary_links:
      title: Primary Links
      type: array
      items:
        type: object
        properties:
          url:
            type: string
          title:
            type: string
    secondary_links:
      title: Secondary Links
      type: array
      items:
        type: object
        properties:
          url:
            type: string
          title:
            type: string
slots:
  lockup:
    title: Lockup
  header_content:
    title: Header content
  cell1:
    title: cell1
    description: 'Optional open variable for placing arbitrary content'
  cell2:
    title: cell2
    description: 'Optional open variable for placing arbitrary content'
  cell3:
    title: cell3
    description: 'Optional open variable for placing arbitrary content'
  address:
    title: address
    description: 'Optional open variable for address content.'
  signup_form_content:
    title: signup_form_content
    description: 'An open variable for placing content above the form.'
