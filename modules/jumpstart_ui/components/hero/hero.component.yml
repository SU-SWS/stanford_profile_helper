'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Hero
description: 'A big graphic element for use as a focal point or a large video.'
props:
  type: object
  properties:
    header_tag:
      title: Header Tag Element
      type: string
      enum:
        - h2
        - h3
        - h4
        - div
    header_classes:
      title: Header Tag Classes
      type: string
      examples:
        - splash
    visually_hide_header:
      title: Visually hide header
      type: boolean
    overlay_position:
      title: Position of card overlay
      type: string
      enum:
        - left
        - right
        - center
    wrapper_class:
      title: Pattern Wrapper Classes
      type: string
      examples:
        - bottom-margin-none
    super_headline:
      title: 'Super Headline'
      type: string
    headline:
      title: Headline
      type: string
    cta_link:
      title: 'CTA Link'
      type: string
    cta_label:
      title: 'CTA Label'
      type: string
    button_link:
      title: 'Button Link'
      type: string
    button_label:
      title: 'Button Label'
      type: string
    show_card:
      title: Show card
      type: boolean
slots:
  image:
    title: Image
    description: 'A full HTML entity for an image. Can be img or picture.'
  body:
    title: Content
    description: 'An open variable for anything. Generally this would be for WYSIWYG editor contents.'
