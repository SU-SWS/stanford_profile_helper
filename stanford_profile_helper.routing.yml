stanford_profile_helper.media_dialog:
  path: '/media/dialog/{media}'
  defaults:
    _controller: '\Drupal\stanford_profile_helper\Controller\MediaDialogController::mediaDialog'
    _title_callback: '\Drupal\stanford_profile_helper\Controller\MediaDialogController::title'
  requirements:
    _entity_access: 'media.view'

stanford_profile_helper.autocomplete.viewfield:
  path: '/admin/viewfield/autocomplete/{view}/{display}'
  defaults:
    _controller: '\Drupal\stanford_profile_helper\Controller\ViewFieldController::handleArgumentsAutocomplete'
    _format: json
  requirements:
    _permission: 'view the administration theme'

entity.layout.edit_icon_form:
  path: '/admin/structure/types/manage/{node_type}/layout-library/{layout}/edit-icon'
  defaults:
    _entity_form: 'layout.edit-icon'
  requirements:
    _entity_access: 'layout.edit'
